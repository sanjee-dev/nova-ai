services:
  - type: web
    name: nova-ai
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn nova.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: nova-chat-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NOVA_DB_PATH
        value: /var/data/chats.sqlite3
      - key: NOVA_LOCAL_PREVIEW
        value: "false"
      - key: NOVA_SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false