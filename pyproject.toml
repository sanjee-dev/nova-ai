[project]
name = "nova-ai-cli"
version = "0.1.0"
description = "NOVA AI CLI - a modern terminal chatbot powered by an open-weight LLM on Groq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "groq>=1.7.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "nova.web:app"
